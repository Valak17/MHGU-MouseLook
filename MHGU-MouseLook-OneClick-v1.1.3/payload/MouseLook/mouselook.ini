; MouseLook for the statically recompiled MHGU PC build.
; Requires Forge PC 0.7 and the exact game executable listed under [build].
;
; F8 toggles MouseLook. Insert opens Forge's menu. Edits are loaded live.
; In gameplay the mouse controls the real render camera. Menus and save selection
; are left entirely to the game.

[mouse]
sens_x_deg_per_count = 0.06
sens_y_deg_per_count = 0.06
invert_x = true
invert_y = true

enabled = true
auto_switch = false
handback_ms = 700
activate_px = 2
button_hold_ms = 100
wheel_hold_ms = 100
stick_keys = IJKL

camera_vector = true
camera_radius = 500

hide_cursor = true
clip_cursor = false
center_cursor = true
cursor_fallback = true
beep = true
debug = false

[keys]
; Mouse button -> keyboard intermediary used by the SDL gamepad mapping.
; RMB and wheel-down both activate gamepad A; wheel-up activates gamepad Y;
; Mouse4 activates gamepad R; Mouse5 activates the L3 click (Left Shift).
left = Z
right = E
middle = LCTRL
x1 = LSHIFT
x2 = C
wheel_up = Q
wheel_down = E
; wheel_hold = LSHIFT

[build]
; Tested against this recompiled executable.
exe_sha256 = 053CAE60DA1BFF123E391E5582A650C1B25E200A0F09A0DD265E321225F38FE5
