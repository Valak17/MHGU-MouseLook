; MouseLookDirect - standalone native camera implementation.
; No hooks are installed at startup. The plugin is inert until F8 is pressed.

[mouse]
sens_x_deg_per_count = 0.06
sens_y_deg_per_count = 0.06
invert_x = true
invert_y = true
toggle_key = F8
settle_ms = 1500
hide_cursor = true
center_cursor = true
button_hold_ms = 100
wheel_hold_ms = 100

[camera]
root = sFestaCamera
angle_mode = false
yaw_offsets = 0xAE,0xEA,0xD2
pitch_offsets = 0x196
yaw_direction = -1
pitch_direction = -1
units_per_turn = 65536
pitch_min = -17000
pitch_max = 17000

[keys]
left = Z
right = E
middle = LCTRL
x1 = LSHIFT
x2 = C
wheel_up = Q
wheel_down = E
